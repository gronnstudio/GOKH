name: Resolve sources
# Run by hand from the Actions tab. Looks up DOIs and ISBNs for unverified sources
# in Crossref, OpenAlex and Open Library, and opens a pull request with what it found.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run resolve -- --write
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: resolution-report
          path: dist/resolution-report.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/resolve-sources
          title: "Sources: identifiers found by the resolver"
          body: |
            Automatic lookup in Crossref + OpenAlex (papers) and Open Library (books).
            DOIs are marked verified only when both registries agree on title, year and first author.
            ISBNs stay `verified: false` until a person confirms the edition.
            The full report, including what still needs a person, is attached to the workflow run.
          commit-message: "Sources: add identifiers found by the resolver"
